<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise of El Brünö</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/img/favicon3.png">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/font.css">
</head>

<body onload="init()">
    <div class="all-content" id="all-content">
        <div class="canvas-button-box" id="canvas-button-box">
            <div class="move-button-box">
                <button class="move-button" id="left-button">⇐</button>
                <button class="move-button" id="right-button">⇒</button>
                <button class="move-button" id="jet-pack-button">J</button>
                <button class="move-button" id="action-button">F</button>
            </div>
            <canvas id="canvas" width="1280" height="720"></canvas>
            <div class="move-button-box">
                <button class="move-button" id="jump-button">⇧</button>
                <button class="move-button" id="down-button">⇩</button>
                <button class="move-button" id="throw-button">↗</button>
                <button class="fullscreen-button" onclick="setFullscreen()">🗖</button>
            </div>
        </div>
        <audio id="background-music" loop>
            <source src="./assets/audio/background-music-level1.opus" type="audio/mpeg">
        </audio>
        <audio id="jet-pack-music" loop>
            <source src="./assets/audio/jet-pack-music.opus" type="audio/mpeg">
        </audio>
        <audio id="jet-pack-sound">
            <source src="./assets/audio/jet-pack-sound.opus" type="audio/mpeg">
        </audio>
        <audio id="speak-sound">
            <source src="./assets/audio/speak1.opus" type="audio/mpeg">
        </audio>
        <audio id="coin-sound">
            <source src="./assets/audio/coin2.opus" type="audio/mpeg">
        </audio>
    </div>
    <div class="overlay-startscreen opacity-none" id="overlay-startscreen">
        <video muted playsinline preload="auto" class="background-video" id="background-video">
            <source src="assets/videos/background-video3.mp4" type="video/mp4">
            Dein Browser unterstützt kein HTML5-Video.
        </video>

        <div class="title-dragon-box">
            <div class="dragon-img-box">
                <img class="dragon" src="./assets/img/Roter Drache mit scharfen Zähnen.webp" alt="">
            </div>
            <h1 id="h1" class="before-animation">RISE OF<br>EL BRÜNÖ</h1>
        </div>
        <div class="img-div-box">
            <div class="img-box">
                <div class="earth-video-box">
                    <video class="earth-video" src="./assets/videos/1393-147055573_small.mp4" autoplay loop muted
                        playsinline preload="auto" disablepictureinpicture
                        controlslist="nodownload nofullscreen noremoteplayback"></video>
                </div>
                <div class="img-box2">
                    <img class="kuecken-img" src="./assets/img/Kücken.webp" alt="">
                    <img class="bruno-img" src="./assets/img/Brünö.webp" alt="">
                    <img class="huhn-img" src="./assets/img/huhn.webp" alt="">
                </div>
                <div class="portal-video-box">
                    <video class="portal-video" src="./assets/videos/27238-362769967_medium.mp4" autoplay loop muted
                        playsinline preload="auto" disablepictureinpicture
                        controlslist="nodownload nofullscreen noremoteplayback"></video>
                </div>
            </div>
            <video class="thunder-video" src="./assets/videos/166697-835224043_medium.mp4" autoplay loop muted
                playsinline preload="auto" disablepictureinpicture
                controlslist="nodownload nofullscreen noremoteplayback"></video>
            <img class="dragon2" src="./assets/img/black-dragon-8808269_1280.webp" alt="">
            <img class="dragon2 red-glow" src="./assets/img/black-dragon-8808269_1280.webp" alt="">
            <div class="startscreen">
                <button class="start-button" id="start-button">Start</button>
                <button class="start-button" id="menu-button">Menü</button>
            </div>
        </div>
    </div>
    <div class="overlay-start-initialisation" id="overlay-start-initialisation">
        <button class="welcome-button" id="welcome-button" onclick="playHoverSound()">Start Game</button>
        <video muted autoplay loop playsinline preload="auto" class="start-initialisation-video"
            id="start-initialisation-video">
            <source src="assets/videos/214405_medium.mp4" type="video/mp4">
            Dein Browser unterstützt kein HTML5-Video.
        </video>
        <video muted playsinline preload="auto" class="start-initialisation-video2 opacity-none"
            id="start-initialisation-video2">
            <source src="assets/videos/Vorspann2.mp4" type="video/mp4">
            Dein Browser unterstützt kein HTML5-Video.
        </video>
    </div>

    <script src="./classes/drawable-object.class.js"></script>
    <script src="./classes/movable-object.class.js"></script>
    <script src="./classes/status-bar.class.js"></script>
    <script src="./classes/task-window.class.js"></script>
    <script src="./classes/popup-text.class.js"></script>
    <script src="./classes/intro-screen.class.js"></script>
    <script src="./classes/life-energy-character-bar.class.js"></script>
    <script src="./classes/life-energy-boss-bar.class.js"></script>
    <script src="./classes/coin-bar.class.js"></script>
    <script src="./classes/bottle-bar.class.js"></script>
    <script src="./classes/character.class.js"></script>
    <script src="./classes/not-movable-npc.js"></script>
    <script src="./classes/chicken-basket.class.js"></script>
    <script src="./classes/chicken-in-basket.class.js"></script>
    <script src="./classes/coin.class.js"></script>
    <script src="./classes/bottle.class.js"></script>
    <script src="./classes/speech-bubble.class.js"></script>
    <script src="./classes/npc.class.js"></script>
    <script src="./classes/chicken.class.js"></script>
    <script src="./classes/cloud.class.js"></script>
    <script src="./classes/ground.class.js"></script>
    <script src="./classes/town.class.js"></script>
    <script src="./classes/sky.class.js"></script>
    <script src="./classes/throwable-object.class.js"></script>
    <script src="./classes/world.class.js"></script>
    <script src="./classes/keyboard.class.js"></script>
    <script src="./classes/level.class.js"></script>
    <script src="./classes/farm-level-setup.class.js"></script>
    <script src="./classes/farm-level-controller.class.js"></script>
    <script src="./classes/stable-level-setup.class.js"></script>
    <script src="./classes/stable-level-controller.class.js"></script>
    <script src="./classes/town-level-setup.class.js"></script>
    <script src="./classes/town-level-controller.class.js"></script>
    <script src="./classes/nayelis-house-level-setup.class.js"></script>
    <script src="./classes/nayelis-house-level-controller.class.js"></script>
    <script src="./classes/new-weapon-level-setup.class.js"></script>
    <script src="./classes/new-weapon-level-controller.class.js"></script>
    <script src="./classes/endboss.class.js"></script>
    <script src="./classes/enboss-attack.class.js"></script>
    <script src="./classes/time-manager.class.js"></script>
    <script src="./classes/event-manager.class.js"></script>
    <script src="./classes/quest-manager.class.js"></script>
    <script src="./classes/stable-quest-manager.class.js"></script>
    <script src="./classes/dialog-manager.class.js"></script>
    <script src="./classes/cutscene-manager.class.js"></script>
    <script src="./classes/sandstorm-effect.class.js"></script>
    <script src="./levels/town-level.js"></script>
    <script src="./levels/farm-level.js"></script>
    <script src="./levels/stable-level.js"></script>
    <script src="./levels/nayelis-house-level.js"></script>
    <script src="./events/farm-level-event.js"></script>
    <script src="./characterImageManifest.js"></script>
    <script src="./npcImageManifest.js"></script>
    <script src="./imageLoader.js"></script>
    <script src="./videoManifest.js"></script>
    <script src="./videoLoader.js"></script>
    <script src="./script.js"></script>
    <script src="./js/game.js"></script>
</body>

</html>
