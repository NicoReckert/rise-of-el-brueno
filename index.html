<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise of El Brünö</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/img/favicon.png">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/font.css">
</head>

<body id="body">
    <div id="loading-overlay">
        <div id="loading-bar"></div>
        <span id="loading-text">Preparing experience…</span>
    </div>

    <div class="all-content" id="all-content">
        <div class="canvas-button-box" id="canvas-button-box">
            <div class="move-button-box" id="move-button-box">
                <div class="left-button-box">
                    <button class="move-button" id="left-button"><img class="mobile-button-icon"
                            src="./assets/icons/left2.png" alt=""></button>
                    <button class="move-button" id="right-button"><img class="mobile-button-icon"
                            src="./assets/icons/right2.png" alt=""></button>
                </div>
                <div class="right-button-box">
                    <button class="move-button" id="action-button"><img class="mobile-button-icon"
                            src="./assets/icons/use.png" alt=""></button>

                    <button class="move-button" id="throw-button"><img class="mobile-button-throw"
                            src="./assets/icons/throw2.png" alt=""></button>

                    <div class="bottom-button-box">
                        <button class="move-button" id="log-button"><img class="mobile-button-icon"
                                src="./assets/icons/log.png" alt=""></button>

                        <button class="move-button" id="jump-button"><img class="mobile-button-icon"
                                src="./assets/icons/jump.png" alt=""></button>

                        <button class="move-button" id="attack-button"><img class="mobile-button-icon"
                                src="./assets/icons/attack.png" alt=""></button>
                    </div>
                </div>
            </div>
            <div class="level-complete-button-box d-none" id="level-complete-button-box">
                <div class="menu-repeat-button-box">
                    <button class="start-button" id="menu-level-button">Menü</button>
                    <button class="start-button" id="repeat-level-button">Wiederholen</button>
                </div>
                <button class="start-button next-level-button" id="next-level-button">Weiter</button>
            </div>
            <!-- Pause-Toggle-Button im Spiel -->
            <button class="pause-toggle-button d-none" id="pause-toggle-button">II</button>
            <button class="mute-toggle-button d-none" id="mute-toggle-button">🔇</button>
            <button class="fullscreen-toggle-button d-none" id="fullscreen-toggle-button">⛶</button>
            <!-- Pause-Overlay -->
            <div class="pause-overlay d-none" id="pause-overlay">
                <div class="pause-menu">
                    <button class="start-button" id="pause-resume-button">Weiter</button>
                    <button class="start-button" id="pause-restart-button">Level neu starten</button>
                    <button class="start-button" id="pause-menu-main-button">Zurück zum Menü</button>
                </div>
            </div>

            <canvas id="canvas" width="1280" height="720"></canvas>
        </div>
        <audio id="background-music" loop>
            <source src="./assets/audio/background-music-level1.opus" type="audio/mpeg">
        </audio>
        <div>
            <div class="overlay-startscreen opacity-none" id="overlay-startscreen">
                <video muted playsinline class="background-video" id="background-video">
                    Dein Browser unterstützt kein HTML5-Video.
                </video>

                <div class="title-dragon-box">
                    <div class="dragon-img-box">
                        <img class="dragon" src="./assets/img/small_dragon.webp" alt="">
                    </div>
                    <h1 class="title" id="h1" class="before-animation">RISE OF<br>EL BRÜNÖ</h1>
                </div>
                <div class="img-div-box">
                    <div class="img-box">
                        <div class="earth-video-box">
                            <video class="earth-video" id="earth-video" loop muted playsinline disablepictureinpicture
                                controlslist="nodownload nofullscreen noremoteplayback"></video>
                        </div>
                        <div class="img-box2">
                            <img class="chick-img" src="./assets/img/chick.webp" alt="">
                            <img class="bruno-img" src="./assets/img/Brünö.webp" alt="">
                            <img class="chicken-img" src="./assets/img/chicken.webp" alt="">
                        </div>
                        <div class="portal-video-box">
                            <video class="portal-video" id="portal-video" loop muted playsinline disablepictureinpicture
                                controlslist="nodownload nofullscreen noremoteplayback"></video>
                        </div>
                    </div>
                    <video class="thunder-video" id="thunder-video" loop muted playsinline disablepictureinpicture
                        controlslist="nodownload nofullscreen noremoteplayback"></video>
                    <img class="dragon2" src="./assets/img/black_dragon.webp" alt="">
                    <img class="dragon2 red-glow" src="./assets/img/black_dragon.webp" alt="">
                    <div class="startscreen">
                        <button class="start-button" id="start-button">Start</button>
                        <button class="start-button" id="info-button" onclick="openStoryOverlay()">Story</button>
                        <button class="start-button" id="info-button" onclick="openOverlay()">Characters</button>
                        <button class="start-button" id="menu-button" onclick="openControlsOverlay()">Steuerung</button>
                        <button class="start-button" id="menu-button" onclick="openCreditsOverlay()">Credits</button>
                    </div>
                </div>
            </div>
            <div class="overlay-start-initialisation" id="overlay-start-initialisation">
                <button class="welcome-button" id="welcome-button">Start Game</button>
                <video muted loop playsinline class="opening-background-video" id="opening-background-video">
                    Dein Browser unterstützt kein HTML5-Video.
                </video>
                <video muted playsinline class="intro-video opacity-none"
                    id="intro-video">
                    Dein Browser unterstützt kein HTML5-Video.
                </video>
            </div>
            <div class="overlay-info d-none" id="overlay-info">
                <video muted loop playsinline disablePictureInPicture controlsList="nodownload noremoteplayback"
                    class="test-video">
                    Dein Browser unterstützt kein HTML5-Video.
                </video>
                <div class="back-box">
                    <button class="start-button" onclick="closeOverlay()">Back</button>
                </div>
                <h1 class="title-characters">Characters</h1>
                <div class="ornament-box">
                    <div class="ornament2"></div>
                </div>
                <div class="small-card-box" id="small-card-box">

                </div>
            </div>
            <div class="overlay-big-card d-none" id="overlay-story">
                <video muted loop playsinline disablePictureInPicture controlsList="nodownload noremoteplayback"
                    class="test-video">
                    Dein Browser unterstützt kein HTML5-Video.
                </video>
                <div class="back-box">
                    <button class="start-button" onclick="closeStoryOverlay()">Back</button>
                </div>
                <h1 class="title-characters">Story</h1>
                <div class="ornament story-ornament-left"></div>
                <div class="ornament story-ornament-right"></div>
                <div class="story-card-box" id="story-box">

                </div>
            </div>

            <div class="overlay-big-card d-none" id="overlay-controls">
                <video muted loop playsinline disablePictureInPicture controlsList="nodownload noremoteplayback"
                    class="test-video">
                    Dein Browser unterstützt kein HTML5-Video.
                </video>
                <div class="back-box">
                    <button class="start-button" onclick="closeControlsOverlay()">Back</button>
                </div>
                <h1 class="title-characters">Steuerung</h1>
                <div class="ornament story-ornament-left"></div>
                <div class="ornament story-ornament-right"></div>
                <div class="controls-box" id="controls-box">

                </div>
            </div>

            <div class="overlay-info d-none" id="overlay-credits">
                <video muted loop playsinline disablePictureInPicture controlsList="nodownload noremoteplayback"
                    class="test-video">
                    Dein Browser unterstützt kein HTML5-Video.
                </video>
                <div class="back-box">
                    <button class="start-button" onclick="closeCreditsOverlay()">Back</button>
                </div>
                <h1 class="title-characters">Credits</h1>
                <div class="ornament story-ornament-left"></div>
                <div class="ornament story-ornament-right"></div>
                <div class="story-card-box" id="credits-box">

                </div>
            </div>

            <div class="overlay-big-card d-none" id="overlay-big-card">
                <div class="ornament ornament-left"></div>
                <div class="ornament ornament-right"></div>
                <div class="big-card-box" id="big-card-box">

                </div>
                <div class="close-box">
                    <button class="start-button" onclick="closeBigBox()">Close</button>
                </div>
            </div>

            <script type="module" src="main.js"></script>
</body>

</html>
