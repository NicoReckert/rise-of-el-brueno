<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise of El Brünö</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./assets/img/shared_visuals/favicon.webp">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/font.css">
</head>

<body id="body">
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-bar" id="loading-bar"></div>
        <span class="loading-text" id="loading-text">Preparing experience…</span>
        <a class="loading-legal-link" href="./legal-notice.html">Legal Notice</a>
    </div>
    <div class="all-content" id="all-content">
        <div class="game-stage">
            <div class="touch-controls" id="touch-controls">
                <div class="touch-controls__movement">
                    <button class="touch-button" id="left-button"><img class="touch-button__icon"
                            src="./assets/icons/left.webp" alt=""></button>
                    <button class="touch-button" id="right-button"><img class="touch-button__icon"
                            src="./assets/icons/right.webp" alt=""></button>
                </div>
                <div class="touch-controls__actions">
                    <div class="touch-controls__primary-actions">
                        <button class="touch-button touch-button--small" id="quest-log-button"><img
                                class="touch-button__icon" src="./assets/icons/log.webp" alt=""></button>
                        <button class="touch-button touch-button--small" id="action-button"><img
                                class="touch-button__icon" src="./assets/icons/use.webp" alt=""></button>
                        <div class="touch-controls__secondary-actions">
                            <button class="touch-button touch-button--throw" id="throw-button"><img
                                    class="touch-button__icon touch-button__icon--throw" src="./assets/icons/throw.webp"
                                    alt=""></button>
                            <button class="touch-button touch-button--protect" id="protect-button"><img
                                    class="touch-button__icon" src="./assets/icons/protect.webp" alt="protect"></button>
                            <button class="touch-button touch-button--jump" id="jump-button"><img
                                    class="touch-button__icon" src="./assets/icons/jump.webp" alt=""></button>
                            <button class="touch-button touch-button--duck" id="duck-button"><img
                                    class="touch-button__icon" src="./assets/icons/duck.webp" alt="duck"></button>
                        </div>
                        <button class="touch-button touch-button--attack" id="attack-button"><img
                                class="touch-button__icon touch-button__icon--attack" src="./assets/icons/attack.webp"
                                alt=""></button>
                    </div>
                </div>
            </div>
            <div class="level-complete-actions d-none" id="level-complete-actions">
                <div class="level-complete-actions__secondary">
                    <button class="menu-button" id="level-complete-menu-button">Main Menu</button>
                    <button class="menu-button" id="restart-level-button">Restart Level</button>
                </div>
                <button class="menu-button next-level-button" id="next-level-button">Next Level</button>
            </div>
            <div class="game-over-actions d-none" id="game-over-actions">
                <button class="menu-button d-none" id="game-over-checkpoint-button">Start at Checkpoint</button>
                <button class="menu-button" id="game-over-restart-button">Restart Level</button>
                <button class="menu-button" id="game-over-menu-button">Main Menu</button>
            </div>
            <div class="end-credits-actions d-none" id="end-credits-actions">
                <button class="menu-button" id="end-credits-menu-button">Main Menu</button>
            </div>
            <button class="pause-toggle-button d-none" id="pause-toggle-button">II</button>
            <button class="mute-toggle-button d-none" id="mute-toggle-button">🔇</button>
            <button class="fullscreen-toggle-button d-none" id="fullscreen-toggle-button">⛶</button>
            <div class="pause-overlay d-none" id="pause-overlay">
                <div class="pause-menu">
                    <button class="menu-button" id="pause-resume-button">Resume</button>
                    <button class="menu-button" id="pause-controls-button">Controls</button>
                    <button class="menu-button" id="pause-credits-button">Legal Notice</button>
                    <button class="menu-button" id="pause-restart-button">Restart Level</button>
                    <button class="menu-button" id="pause-menu-main-button">Main Menu</button>
                </div>
            </div>
            <canvas id="canvas" width="1280" height="720"></canvas>
            <video class="game-over-video d-none" id="game-over-video" playsinline preload="none"
                disablePictureInPicture controlsList="nodownload nofullscreen noremoteplayback"></video>
            <div class="game-over-video-overlay d-none" id="game-over-video-overlay"></div>
            <div class="game-over-video-vignette d-none" id="game-over-video-vignette"></div>
            <div class="game-over-video-light d-none" id="game-over-video-light"></div>
            <video class="end-credits-video d-none" id="end-credits-video" playsinline preload="none"
                disablePictureInPicture controlsList="nodownload nofullscreen noremoteplayback"></video>
        </div>
    </div>
    <div class="start-screen-overlay opacity-none" id="start-screen-overlay">
        <video muted playsinline disablePictureInPicture controlsList="nodownload nofullscreen noremoteplayback"
            class="background-video" id="background-video">
            Dein Browser unterstützt kein HTML5-Video.
        </video>
        <div class="start-screen-header">
            <div class="dragon-img-box">
                <img class="dragon" src="./assets/img/shared_visuals/small_dragon.webp" alt="">
            </div>
            <h1 class="title before-animation" id="game-title">RISE OF<br>EL BRÜNÖ</h1>
        </div>
        <div class="start-screen-content">
            <div class="start-screen-media">
                <div class="earth-video-box">
                    <video class="earth-video" id="earth-video" loop muted playsinline disablePictureInPicture
                        controlsList="nodownload nofullscreen noremoteplayback"></video>
                </div>
                <div class="hero-character-group">
                    <img class="chick-img" src="./assets/img/shared_visuals/chick.webp" alt="">
                    <img class="bruno-img" src="./assets/img/shared_visuals/Brünö.webp" alt="">
                    <img class="chicken-img" src="./assets/img/shared_visuals/chicken.webp" alt="">
                </div>
                <div class="portal-video-box">
                    <video class="portal-video" id="portal-video" loop muted playsinline disablePictureInPicture
                        controlsList="nodownload nofullscreen noremoteplayback"></video>
                </div>
            </div>
            <div class="dragon-thunder-box">
                <video class="thunder-video" id="thunder-video" loop muted playsinline disablePictureInPicture
                    controlsList="nodownload nofullscreen noremoteplayback"></video>
                <img class="dragon-silhouette" src="./assets/img/shared_visuals/black_dragon.webp" alt="">
                <img class="dragon-silhouette red-glow" src="./assets/img/shared_visuals/black_dragon.webp" alt="">
            </div>
            <div class="start-menu">
                <button class="menu-button" id="play-game-button">Play</button>
                <button class="menu-button" id="open-story-button">Story</button>
                <button class="menu-button" id="open-characters-button">Characters</button>
                <button class="menu-button" id="open-controls-button">Controls</button>
                <button class="menu-button" id="open-credits-button">Legal Notice</button>
            </div>
        </div>
    </div>
    <div class="intro-overlay" id="intro-overlay">
        <button class="intro-start-button" id="intro-start-button">Start Game</button>
        <div class="intro-actions d-none" id="intro-actions">
            <button class="menu-button" id="intro-skip-button">Skip</button>
        </div>
        <video muted loop playsinline disablePictureInPicture controlsList="nodownload nofullscreen noremoteplayback"
            class="opening-background-video" id="opening-background-video">
        </video>
        <video muted playsinline disablePictureInPicture controlsList="nodownload nofullscreen noremoteplayback"
            class="intro-video opacity-none" id="intro-video">
        </video>
        <a class="loading-legal-link" href="./legal-notice.html">Legal Notice</a>
    </div>
    <video muted loop playsinline disablePictureInPicture controlsList="nodownload nofullscreen noremoteplayback"
        class="submenu-video" id="submenu-video">
    </video>
    <div class="page-overlay d-none" id="characters-overlay">
        <div class="overlay-back">
            <button class="menu-button" id="close-characters-overlay-button">Back</button>
        </div>
        <h1 class="overlay-title">Characters</h1>
        <div class="character-list" id="character-list">

        </div>
    </div>
    <div class="detail-overlay d-none" id="story-overlay">
        <div class="overlay-back">
            <button class="menu-button" id="close-story-overlay-button">Back</button>
        </div>
        <h1 class="overlay-title">Story</h1>
        <div class="overlay-section" id="story-section">

        </div>
    </div>
    <div class="detail-overlay d-none" id="controls-overlay">
        <div class="overlay-back">
            <button class="menu-button" id="close-controls-overlay-button">Back</button>
        </div>
        <h1 class="overlay-title">Controls</h1>
        <div class="ornament story-ornament-left"></div>
        <div class="ornament story-ornament-right"></div>
        <div class="controls-section" id="controls-section">

        </div>
    </div>
    <div class="page-overlay d-none" id="credits-overlay">
        <div class="overlay-back">
            <button class="menu-button" id="close-credits-overlay-button">Back</button>
        </div>
        <h1 class="overlay-title">Legal Notice</h1>
        <div class="ornament story-ornament-left"></div>
        <div class="ornament story-ornament-right"></div>
        <div class="overlay-section" id="credits-section">

        </div>
    </div>
    <div class="detail-overlay d-none" id="character-detail-overlay">
        <div class="detail-card-container" id="detail-card-container">

        </div>
        <div class="detail-overlay__close">
            <button class="menu-button" id="close-detail-overlay-button">Close</button>
        </div>
    </div>
    <div class="overlay-landscape-spinner">
        <span class="landscape-spinner"><span class="spinner-ring"></span></span>
    </div>
    <script type="module" src="main.js"></script>
</body>

</html>
